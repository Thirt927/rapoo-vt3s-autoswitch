[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rapoo-autoswitch"
version = "0.1.0"
description = "按电脑自动切换雷柏二代鼠标（VT3S V2 等）配置的命令行工具与后台守护"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "rapoo-vt3s-autoswitch contributors" }]
keywords = ["rapoo", "vt3s", "hid", "mouse", "profile", "autoswitch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Hardware :: Hardware Drivers",
]

# 硬件通信依赖 hidapi 的 Python 绑定；仅在真正连鼠标的机器上需要，
# 纯逻辑与单元测试不需要它。
dependencies = ["hid>=0.14"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
rapoo-autoswitch = "rapoo_autoswitch.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
